services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MyStrong!Passw0rd"
    ports:
      - "1433:1433"
    networks:
      - medilabo-network

  patient-api:
    build:
      context: ..
      dockerfile: Backend/Mls.Patients.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__PatientDb: "Server=sqlserver;Database=PatientDb;User Id=sa;Password=MyStrong!Passw0rd;TrustServerCertificate=True"
    depends_on:
      - sqlserver
    ports:
      - "5046:8080"
    networks:
      - medilabo-network

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    networks:
      - medilabo-network

  notes-api:
    build:
      context: ..
      dockerfile: Backend/Mls.Notes.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__NotesDb: "mongodb://mongo:27017"
    depends_on:
      - mongo
    ports:
      - "5047:8080"
    networks:
      - medilabo-network
  
  assessment-api:
    build:
      context: ..
      dockerfile: Backend/Mls.Assessment.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Services__PatientsApiBaseUrl: "http://patient-api:8080/"
      Services__NotesApiBaseUrl: "http://notes-api:8080/"
    depends_on:
      - patient-api
      - notes-api
    ports:
      - "5048:8080"
    networks:
      - medilabo-network

  gateway:
    build:
      context: ..
      dockerfile: Gateway/Mls.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Routes__0__DownstreamHostAndPorts__0__Host: patient-api
      Routes__0__DownstreamHostAndPorts__0__Port: "8080"
      Routes__1__DownstreamHostAndPorts__0__Host: patient-api
      Routes__1__DownstreamHostAndPorts__0__Port: "8080"
      Routes__2__DownstreamHostAndPorts__0__Host: notes-api
      Routes__2__DownstreamHostAndPorts__0__Port: "8080"
      Routes__3__DownstreamHostAndPorts__0__Host: notes-api
      Routes__3__DownstreamHostAndPorts__0__Port: "8080"
      Routes__4__DownstreamHostAndPorts__0__Host: notes-api
      Routes__4__DownstreamHostAndPorts__0__Port: "8080"
      Routes__5__DownstreamHostAndPorts__0__Host: assessment-api
      Routes__5__DownstreamHostAndPorts__0__Port: "8080"
    depends_on:
      - patient-api
      - notes-api
      - assessment-api
    ports:
      - "5141:8080"
    networks:
      - medilabo-network

  frontend:
    build:
      context: ..
      dockerfile: Frontend/Mls.Frontend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ApiSettings__GatewayBaseUrl: "http://gateway:8080/"
    depends_on:
      - gateway
    ports:
      - "5000:8080"
    networks:
      - medilabo-network

networks:
  medilabo-network:
    driver: bridge
